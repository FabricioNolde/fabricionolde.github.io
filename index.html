<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagar com Pix</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #eef6f4; color: #1c2b2a;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff; width: 100%; max-width: 380px; border-radius: 20px;
    padding: 28px 22px; text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
  }
  .tag { display: inline-block; background: #32bcad; color: #fff; font-weight: 700;
    font-size: 13px; letter-spacing: .5px; padding: 4px 12px; border-radius: 99px; }
  h1 { font-size: 22px; margin: 14px 0 4px; }
  .sub { color: #5d6e6c; font-size: 14px; }
  .qr { margin: 20px auto 6px; width: 220px; }
  .qr svg { width: 100%; height: auto; display: block; }
  .label { font-size: 12px; color: #5d6e6c; text-transform: uppercase; letter-spacing: .6px; margin-top: 18px; }
  .key { font-size: 18px; font-weight: 600; word-break: break-all; margin: 6px 0 12px; }
  button {
    width: 100%; border: 0; border-radius: 14px; padding: 15px; font-size: 16px;
    font-weight: 700; cursor: pointer; margin-top: 8px;
  }
  .primary { background: #32bcad; color: #fff; }
  .secondary { background: #e3f3f1; color: #1c6f66; }
  .ok { background: #1c6f66 !important; color: #fff !important; }
  .help { font-size: 13px; color: #5d6e6c; margin-top: 18px; line-height: 1.45; }
  .erro { color: #b3261e; }
</style>
</head>
<body>
<div class="card" id="card"></div>

<script>
/* ============================================================
   CADASTRE SEUS CLIENTES AQUI
   - O código da loja vai no link:  .../pix/?c=barbearia
   - chave: CPF/CNPJ só números, telefone no formato +5551999999999,
     e-mail ou chave aleatória
   - nome (até 25 letras) e cidade (até 15 letras) do recebedor,
     iguais aos da conta Pix
   ============================================================ */
const CLIENTES = {
  barbearia: {
    loja:   "Barbearia Família",
    chave:  "+5551999933059",
    nome:   "Barbearia Familia",
    cidade: "Porto Alegre"
  }
  // , outraloja: { loja: "...", chave: "...", nome: "...", cidade: "..." }
};

/* ---------- não precisa mexer daqui para baixo ---------- */
function limpar(txt, max) {
  return txt.normalize("NFD").replace(/[̀-ͯ]/g, "")
            .replace(/[^A-Za-z0-9 ]/g, "").toUpperCase().slice(0, max).trim();
}
function campo(id, valor) {
  return id + String(valor.length).padStart(2, "0") + valor;
}
function crc16(str) {
  let crc = 0xFFFF;
  for (let i = 0; i < str.length; i++) {
    crc ^= str.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) {
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
      crc &= 0xFFFF;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4, "0");
}
function payloadPix(c) {
  const conta = campo("00", "br.gov.bcb.pix") + campo("01", c.chave.trim());
  let p = campo("00", "01") +
          campo("26", conta) +
          campo("52", "0000") +
          campo("53", "986") +
          campo("58", "BR") +
          campo("59", limpar(c.nome, 25)) +
          campo("60", limpar(c.cidade, 15)) +
          campo("62", campo("05", "***")) +
          "6304";
  return p + crc16(p);
}
function copiar(texto, botao, rotulo) {
  const feito = () => {
    botao.textContent = "Copiado! ✓"; botao.classList.add("ok");
    setTimeout(() => { botao.textContent = rotulo; botao.classList.remove("ok"); }, 2500);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(texto).then(feito, () => reserva());
  } else { reserva(); }
  function reserva() {
    const t = document.createElement("textarea");
    t.value = texto; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select(); t.setSelectionRange(0, 99999);
    try { document.execCommand("copy"); feito(); } catch (e) { prompt("Copie a chave:", texto); }
    document.body.removeChild(t);
  }
}

const params = new URLSearchParams(location.search);
const codigo = params.get("c") || Object.keys(CLIENTES)[0];
const cli = CLIENTES[codigo];
const card = document.getElementById("card");

if (!cli) {
  card.innerHTML = '<p class="erro">Loja não encontrada.</p>';
} else {
  document.title = "Pix - " + cli.loja;
  const copiaECola = payloadPix(cli);
  card.innerHTML =
    '<span class="tag">PIX</span>' +
    '<h1></h1><p class="sub">Pague com Pix pelo app do seu banco</p>' +
    '<div class="qr" id="qr"></div>' +
    '<p class="label">Chave Pix</p><p class="key" id="key"></p>' +
    '<button class="primary" id="btnChave">Copiar chave Pix</button>' +
    '<p class="help">Copie a chave, abra o app do seu banco, ' +
    'vá em <b>Pix</b> e cole. Confira o nome do recebedor antes de pagar.</p>';
  card.querySelector("h1").textContent = cli.loja;
  document.getElementById("key").textContent = cli.chave;

  const bChave = document.getElementById("btnChave");
  bChave.onclick = () => copiar(cli.chave, bChave, "Copiar chave Pix");

  if (typeof qrcode === "function") {
    const qr = qrcode(0, "M");
    qr.addData(copiaECola);
    qr.make();
    document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
  } else {
    document.getElementById("qr").style.display = "none";
  }
}
</script>
</body>
</html>
